services:
  fitness:
    build: .
    container_name: fitness-tracker
    ports:
      - "8000:8000"
    volumes:
      # SQLite file, WAL sidecars, and the JWT secret all live here.
      - ./data:/data
    environment:
      # Flip to "false" once both accounts exist to close signups.
      ALLOW_REGISTRATION: "true"
      TOKEN_TTL_DAYS: "30"
      TZ: "America/New_York"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
